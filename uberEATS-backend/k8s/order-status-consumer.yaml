apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-status-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-status-consumer
  template:
    metadata:
      labels:
        app: order-status-consumer
    spec:
      containers:
        - name: order-status-consumer
          image: mydocker05/ubereats-order-status-consumer:latest
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: order-status-consumer
            - name: KAFKA_GROUP_ID
              value: restaurant-group
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"
            - name: MONGO_URI
              value: mongodb://mongo-db:27017/ubereats_db
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "2001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 2001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 2001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-status-consumer
spec:
  selector:
    app: order-status-consumer
  ports:
    - name: http
      port: 2001
      targetPort: 2001
  type: ClusterIP
