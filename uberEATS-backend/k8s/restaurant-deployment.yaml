apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: mydocker05/ubereats-backend-restaurant-service:latest
          ports:
            - containerPort: 2002
          env:
            - name: PORT
              value: "2002"
            - name: MONGO_URI
              value: "mongodb://mongo-db:27017/ubereats_db"
            - name: SESSION_SECRET
              value: "ubereats-secret"
            - name: FRONTEND_URL
              value: "http://localhost:3000"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
