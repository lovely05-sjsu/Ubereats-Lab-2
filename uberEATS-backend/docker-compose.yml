version: '3.8'

services:
  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongo-db:27017/ubereats_db
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=user-service
    depends_on:
      - mongo-db
      - kafka
      - kafka-init
    networks:
      - ubereats-network

  # Restaurant Service
  restaurant-service:
    build:
      context: .
      dockerfile: Dockerfile.restaurant
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - MONGO_URI=mongodb://mongo-db:27017/ubereats_db
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=restaurant-service
    depends_on:
      - mongo-db
      - kafka
      - kafka-init
    networks:
      - ubereats-network

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - MONGO_URI=mongodb://mongo-db:27017/ubereats_db
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=order-service
    depends_on:
      - mongo-db
      - kafka
      - kafka-init
    networks:
      - ubereats-network

  # Order Status Consumer
  order-status-consumer:
    build:
      context: .
      dockerfile: Dockerfile.order-status-consumer
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo-db:27017/ubereats_db
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=order-status-consumer
      - KAFKA_GROUP_ID=restaurant-group
      - KAFKAJS_NO_PARTITIONER_WARNING=1
    depends_on:
      - mongo-db
      - kafka
      - kafka-init
    networks:
      - ubereats-network

  # MongoDB
  mongo-db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ubereats-network

  # Kafka
  kafka:
    image: bitnami/kafka:3.5.1
    ports:
      - "9092:9092"
    environment:
      - BITNAMI_DEBUG=true
      - KAFKA_ENABLE_KRAFT=no
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper
    networks:
      - ubereats-network

  # Zookeeper
  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - ubereats-network

  # Kafka Initialization Service
  kafka-init:
    image: bitnami/kafka:3.5.1
    depends_on:
      - kafka
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...' &&
        sleep 30 &&
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic order_created --partitions 1 --replication-factor 1 &&
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic order_status_updated --partitions 1 --replication-factor 1 &&
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic order_status_confirmed --partitions 1 --replication-factor 1 &&
        echo 'Kafka topics created successfully'"
    networks:
      - ubereats-network

volumes:
  mongodb_data:

networks:
  ubereats-network:
    driver: bridge
