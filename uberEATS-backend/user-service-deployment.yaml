apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:latest
        imagePullPolicy: Never
        env:
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: MONGODB_URI
          value: "mongodb://mongo-db:27017/ubereats_db"
        - name: NODE_ENV
          value: "development"
      volumes:
      - name: app-code
        configMap:
          name: user-service-code 